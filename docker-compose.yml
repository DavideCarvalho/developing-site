# A forma do deploy, executável. Não é ambiente de desenvolvimento (para isso
# existe `npm run dev`): é a descrição mínima e verificável do que a produção
# precisa subir — UM processo.
#
#   docker compose up --build
#
# Ver docs/deploy.md para o detalhe e para o que muda em plataformas que não
# usam compose.
services:
  web:
    build: .
    # O entrypoint roda `migration:run --force` antes do CMD. Este processo
    # também é quem agenda: o loop do @adonis-agora/durable roda aqui dentro
    # (worker.embedded em config/durable.ts), sem container separado.
    command: ['node', 'bin/server.js']
    env_file: .env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3333'
    ports:
      - '3333:3333'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    env_file: .env.production
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_DATABASE}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
